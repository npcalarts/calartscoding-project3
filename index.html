<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;padding:0;background:#000;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr,u;
function size(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);
  u=Math.max(.45,Math.min(1.4,Math.min(W,H)/700)); // glyph scale
}
addEventListener('resize',size);size();
let wins=[],nightT=3,nextMeteor=10;const meteors=[];
// seeded randomness so the same skyline is rebuilt (not re-rolled) when the window resizes
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hs=n=>{n=Math.imul(n^n>>>15,n|1);n^=n+Math.imul(n^n>>>7,n|61);return((n^n>>>14)>>>0)/4294967296};
function build(){
  wins=[];
  const cell=Math.max(4,Math.round(4*u)),ww=cell-2,snap=v=>Math.round(v/cell)*cell;
  function fill(seed,x,bw,y0,y1,bd){
    for(let yy=y0;yy<y1;yy+=cell)for(let xx=x;xx<x+bw-cell/2;xx+=cell){
      const row=Math.round((H-yy)/cell),col=Math.round((xx-x)/cell),k=seed*1000003+col*7919+row*104729;
      if(hs(k+1)<.6){const v=232+hs(k+2)*23|0;wins.push({x:xx,y:yy,c:`${v},${v},${v}`,d:bd+hs(k+3)*16,m:.45+hs(k+4)*.55,p:hs(k+5)*6.28,v:.05+hs(k+6)*.15,tw:hs(k+7)<.3})}
    }
  }
  function tower(i,x,bw,bh,R,bd){
    fill(i,x,bw,H-bh,H,bd);
    if(bw>cell*5&&R()<.5){ // stepped crown
      const cw=snap(bw*(.4+R()*.3)),ch=snap(H*(.03+R()*.09)),cx=x+snap((bw-cw)/2);
      fill(i+500,cx,cw,H-bh-ch,H-bh,bd+4);
      if(R()<.5)bh+=ch,x=cx,bw=cw;
    }
    if(bh>H*.28&&R()<.55){ // antenna with blinking lamp
      const ax=x+snap(bw/2),top=H-bh-cell*7;
      for(let j=1;j<7;j++)wins.push({x:ax,y:top+j*cell,c:'240,240,240',d:bd+20,m:.5,p:0,v:.1,tw:false});
      wins.push({x:ax,y:top,c:'40,255,70',d:bd+22,m:1,p:R()*6.28,v:.1,tw:false,bl:true});
    }
  }
  let x=snap(W*.01),i=0;
  while(x<W){
    const R=mul(1000+i),k=R();let bw,bh;
    if(k<.28){bw=cell*(4+(R()*4|0));bh=H*(.2+R()*.32)}
    else if(k<.65){bw=cell*(8+(R()*9|0));bh=H*(.08+R()*.26)}
    else{bw=cell*(14+(R()*16|0));bh=H*(.04+R()*.13)}
    bw=Math.min(bw,W-x);bh=snap(bh);
    const bd=i<2?0:R()*50,gap=cell*(R()*6|0);
    if(bw>cell*2)tower(i,x,bw,bh,R,bd);
    x+=bw+gap;i++;
  }
  wins.ww=ww;
}
addEventListener('resize',build);build();

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=(a,b,v)=>{v=clamp((v-a)/(b-a));return v*v*(3-2*v)};
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

const stops=[
[0,[0,0,0],[0,0,0]],
[.15,[4,6,30],[20,16,70]],
[.3,[30,14,90],[220,40,110]],
[.42,[90,60,200],[255,140,60]],
[.55,[60,120,235],[255,205,150]],
[.75,[50,130,240],[190,225,255]],
[1,[20,110,245],[170,225,255]]];
function sky(t){const k=sm(.02,.5,t),c=mix([0,0,0],[0,0,170],k);return [c,c]}
function sky0(t){
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){
      const a=stops[i-1],b=stops[i],k=(t-a[0])/(b[0]-a[0]);
      return [mix(a[1],b[1],k),mix(a[2],b[2],k)];
    }
  }
  return [stops[6][1],stops[6][2]];
}

let t=0.95,dir=0;
const FONT='"Space Mono",ui-monospace,Menlo,monospace';
const stars=Array.from({length:380},()=>({x:Math.random(),y:Math.random(),s:7+Math.random()*10,px:Math.random()<.8,p:Math.random()*6.28,v:.6+Math.random()*1.8}));
const drops=Array.from({length:300},()=>({x:Math.random(),y:Math.random(),s:14+Math.random()*14,v:.7+Math.random()*.6}));

function draw(now,dt){
  const r=sm(.5,.62,t)*(1-sm(.8,.92,t));
  let [top,bot]=sky(t);
  

  const sg=g.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,rgb(top));sg.addColorStop(1,rgb(bot));
  g.fillStyle=sg;g.fillRect(0,0,W,H);

  // horizon light
  const warm=0;
  if(warm>0){
    const gc=mix([255,50,120],[255,175,70],sm(.28,.5,t));
    g.save();g.translate(W/2,H);g.scale(1,H/W*1.1);
    const R=Math.max(W,H*.9)*.75;
    const rg=g.createRadialGradient(0,0,0,0,0,R);
    rg.addColorStop(0,rgb(gc,.9*warm*(1-r)));rg.addColorStop(1,rgb(gc,0));
    g.fillStyle=rg;g.fillRect(-R,-R,R*2,R*2);g.restore();
  }
  // overhead bloom in full day
  const bl=0;
  if(bl>0){
    const R=Math.max(W,H)*.7;
    const bg=g.createRadialGradient(W/2,0,0,W/2,0,R);
    bg.addColorStop(0,`rgba(255,255,255,${.35*bl})`);bg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=bg;g.fillRect(0,0,W,H);
  }

  g.textAlign='center';g.textBaseline='middle';

  // stars
  const sa=0;
  if(sa>0){
    for(const s of stars){
      const tw=.4+.6*Math.abs(Math.sin(now/1000*s.v+s.p));
      const fs=s.s*u;
      g.fillStyle=`rgba(255,255,240,${sa*tw})`;
      if(s.px){const q=Math.max(1,Math.round(u*(s.s>11?2:1)));g.fillRect(Math.round(s.x*W),Math.round(s.y*H*.85),q,q)}
      else{g.font=`700 ${fs}px ${FONT}`;g.fillText('*',s.x*W,s.y*H*.85+fs*.4)}
    }
  }

  // night skyline of dotted windows
  const ca=1-sm(.12,.34,t);
  if(ca>0){
    const T=now/1000,q0=wins.ww;nightT+=dt;
    for(const w of wins){
      const f=clamp((nightT-w.d)/6);if(f<=0)continue;
      let k=w.tw?sm(.15,.85,.5+.5*Math.sin(T*w.v+w.p)):.85+.15*Math.sin(T*w.v*3+w.p);
      if(w.bl)k=Math.sin(T*1.2+w.p)>.6?1:.08;
      const a=ca*f*f*w.m*k;if(a<.02)continue;
      g.fillStyle=`rgba(${w.c},${a})`;g.fillRect(w.x,w.y,q0,q0);
    }
    nextMeteor-=dt;
    if(nextMeteor<=0&&ca>.6&&nightT>6&&meteors.length<1){
      nextMeteor=18+Math.random()*30;
      meteors.push({x:W*(.35+Math.random()*.65),y:H*Math.random()*.3,a:2.65+Math.random()*.3,v:W*(.35+Math.random()*.2),l:0,d:1.3+Math.random()*.6});
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];m.l+=dt;m.x+=Math.cos(m.a)*m.v*dt;m.y+=Math.sin(m.a)*m.v*dt;
      const f=m.l/m.d;if(f>=1){meteors.splice(i,1);continue}
      const q=Math.max(2,Math.round(2*u));
      for(let k=0;k<22;k++){g.fillStyle=`rgba(110,130,255,${ca*Math.sin(f*Math.PI)*(1-k/22)})`;g.fillRect(Math.round(m.x-Math.cos(m.a)*k*q*2),Math.round(m.y-Math.sin(m.a)*k*q*2),q,q)}
    }
  }else nightT=3;

  // rain
  if(r>.02){
    const n=Math.floor(drops.length*r);
    g.fillStyle=`rgba(0,0,0,${.7*r})`;
    for(let i=0;i<n;i++){
      const d=drops[i];
      d.y+=d.v*dt*.9;d.x-=d.v*dt*.9*(H/W)*.6;
      if(d.y>1.05){d.y=-.05;d.x=Math.random()*1.4}
      if(d.x<-.05)d.x+=1.1;
      const L=d.s*u*.8;g.fillRect(Math.round(d.x*W),Math.round(d.y*H),1,1);
      for(let k=0;k<L;k+=2){g.fillRect(Math.round(d.x*W+k*.45),Math.round(d.y*H-k),Math.max(1,Math.round(u)),2)}
    }
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(dir)t=clamp(t+dir*dt*.2);
  draw(now,dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// arrow keys (hold)
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){dir=1;e.preventDefault()}
  else if(e.key==='ArrowDown'){dir=-1;e.preventDefault()}
});
addEventListener('keyup',e=>{
  if((e.key==='ArrowUp'&&dir===1)||(e.key==='ArrowDown'&&dir===-1))dir=0;
});
addEventListener('blur',()=>dir=0);

// trackpad / mouse wheel: scroll down toward night, up toward day
addEventListener('wheel',e=>{
  e.preventDefault();
  const k=e.deltaMode===1?.03:.0015;
  t=clamp(t-e.deltaY*k);
},{passive:false});

// touch drag
let ty=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){ty=e.clientY;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(ty!==null){t=clamp(t+(ty-e.clientY)*.003);ty=e.clientY}});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>ty=null));
</script>
</body>
</html>
